<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradiente Rose Gold Metálico Espelhado (inspirado na placa de acrílico espelhado) -->
    <linearGradient id="roseGoldMirror" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c98a93" />
      <stop offset="20%" stop-color="#fdf4f5" />
      <stop offset="42%" stop-color="#b76e79" />
      <stop offset="68%" stop-color="#7e3b45" />
      <stop offset="85%" stop-color="#d49da4" />
      <stop offset="100%" stop-color="#f5e1e4" />
    </linearGradient>

    <!-- Gradiente da Moldura -->
    <linearGradient id="roseGoldFrame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7e3b45" />
      <stop offset="50%" stop-color="#d49da4" />
      <stop offset="100%" stop-color="#fdf4f5" />
    </linearGradient>

    <!-- Fundo Pérola Suave da Parede -->
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f6edef" />
    </linearGradient>

    <!-- Efeito de Sombra de Relevo Espelhado -->
    <filter id="mirrorShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="3" dy="8" stdDeviation="8" flood-color="#54252c" flood-opacity="0.32"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#9f5661" flood-opacity="0.18"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Montserrat:wght@500;700&amp;display=swap');
    .script-text {
      font-family: 'Great Vibes', 'Segoe Script', 'Brush Script MT', cursive;
      font-weight: 400;
    }
    .caps-text {
      font-family: 'Montserrat', 'Segoe UI', -apple-system, sans-serif;
    }
  </style>

  <!-- Fundo Squircle Efeito Parede Minimalista -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#wallBg)" filter="url(#cardShadow)" />

  <!-- Moldura Fina Rose Gold Metálica -->
  <rect x="38" y="38" width="436" height="436" rx="110" stroke="url(#roseGoldFrame)" stroke-width="2.5" fill="none" />

  <!-- Brilho Circular de Destaque -->
  <circle cx="256" cy="225" r="145" fill="#fdf4f5" fill-opacity="0.6" />

  <!-- Monograma Caligráfico Cursivo VB com Sombra de Acrílico Espelhado -->
  <g filter="url(#mirrorShadow)">
    <text x="256" y="275" text-anchor="middle" class="script-text" font-size="235" fill="url(#roseGoldMirror)">VB</text>
  </g>

  <!-- Brilho Especular de Reflexo no Canto da Letra -->
  <path d="M 378 128 Q 378 146 396 146 Q 378 146 378 164 Q 378 146 360 146 Q 378 146 378 128 Z" fill="url(#roseGoldMirror)" />
  <circle cx="378" cy="146" r="3" fill="#ffffff" />

  <path d="M 132 290 Q 132 302 144 302 Q 132 302 132 314 Q 132 302 120 302 Q 132 302 132 290 Z" fill="url(#roseGoldMirror)" />

  <!-- Assinatura Oficial da Marca -->
  <text x="256" y="386" text-anchor="middle" class="caps-text" font-size="24" font-weight="700" letter-spacing="7" fill="#7e3b45">VAL BROMBINI</text>
  <text x="256" y="414" text-anchor="middle" class="caps-text" font-size="11" font-weight="600" letter-spacing="5" fill="#b76e79">ESPAÇO DE BELEZA</text>
</svg>
